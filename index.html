<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>나에게 맞는 직무 유형 테스트</title>
    <meta
      name="description"
      content="조별과제, 동아리, 아르바이트 속 12가지 질문으로 나에게 어울리는 직무와 준비할 자격증·과목을 알아보세요."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-canvas: #f2fbf8;
        --surface-card: #ffffff;
        --surface-soft: #f8fdfa;
        --surface-hover: #edf9f5;
        --surface-selected: #e2f8f0;
        --surface-mint: #e6f7f1;
        --border-subtle: #cbece1;
        --border-option: #d2eee4;
        --divider: #e0f2ec;
        --divider-light: #ebf6f2;
        --ink-primary: #102a25;
        --ink-secondary: #47655e;
        --ink-muted: #577770;
        --accent: #0f766e;
        --accent-hover: #115e59;
        --progress-track: #d9f2ea;
      }

      * {
        box-sizing: border-box;
      }

      html {
        font-family: "Plus Jakarta Sans", "Noto Sans KR", -apple-system, BlinkMacSystemFont,
          "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
        background-color: var(--bg-canvas);
        color: var(--ink-primary);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        word-break: keep-all;
      }

      body {
        margin: 0;
        min-height: 100dvh;
        background-color: var(--bg-canvas);
        display: flex;
        flex-direction: column;
      }

      button {
        font-family: inherit;
      }

      .tabular-nums {
        font-variant-numeric: tabular-nums;
      }

      /* Header */
      .app-header {
        width: 100%;
        padding: 20px 20px 8px;
      }

      .header-inner {
        max-width: 896px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }

      .brand-btn {
        background: none;
        border: none;
        padding: 4px 6px;
        margin-left: -6px;
        border-radius: 8px;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: -0.01em;
        color: var(--ink-primary);
        cursor: pointer;
        white-space: nowrap;
        transition: color 0.15s ease;
      }

      .brand-btn:hover {
        color: var(--accent);
      }

      .home-btn {
        background: none;
        border: none;
        padding: 6px 8px;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 500;
        color: var(--ink-secondary);
        cursor: pointer;
        white-space: nowrap;
        transition: color 0.15s ease;
      }

      .home-btn:hover {
        color: var(--ink-primary);
      }

      .brand-btn:focus-visible,
      .home-btn:focus-visible,
      .primary-btn:focus-visible,
      .secondary-btn:focus-visible,
      .back-btn:focus-visible,
      .choice-btn:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      /* Main Layout */
      .app-main {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 16px 40px;
      }

      .container-wide {
        width: 100%;
        max-width: 896px;
        margin: 0 auto;
      }

      .container-quiz {
        width: 100%;
        max-width: 672px;
        margin: 0 auto;
      }

      .card {
        background-color: var(--surface-card);
        border: 1px solid var(--border-subtle);
        border-radius: 24px;
        box-shadow: 0 14px 36px -18px rgba(15, 118, 110, 0.16);
        padding: 24px;
      }

      /* Start & Result Grids */
      .start-grid,
      .result-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 28px;
        align-items: center;
      }

      .kicker {
        margin: 0;
        font-size: 13px;
        font-weight: 500;
        color: var(--accent);
        letter-spacing: -0.01em;
      }

      .hero-title {
        margin: 12px 0 0;
        font-size: 28px;
        font-weight: 700;
        line-height: 1.24;
        letter-spacing: -0.02em;
        color: var(--ink-primary);
        text-wrap: balance;
      }

      .hero-desc {
        margin: 16px 0 0;
        font-size: 15px;
        line-height: 1.65;
        color: var(--ink-secondary);
      }

      .role-line {
        margin: 22px 0 0;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px 10px;
        font-size: 13px;
        color: var(--ink-muted);
      }

      .cta-wrap {
        margin-top: 30px;
      }

      .primary-btn {
        width: 100%;
        min-height: 52px;
        padding: 14px 28px;
        border: none;
        border-radius: 16px;
        background-color: var(--accent);
        color: #ffffff;
        font-size: 16px;
        font-weight: 600;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        box-shadow: 0 8px 20px -8px rgba(15, 118, 110, 0.45);
        cursor: pointer;
        white-space: nowrap;
        transition: background-color 0.16s ease, transform 0.14s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .primary-btn:hover {
        background-color: var(--accent-hover);
        transform: scale(1.015);
      }

      .primary-btn:active {
        transform: scale(0.975);
      }

      .secondary-btn {
        width: 100%;
        min-height: 50px;
        padding: 12px 24px;
        border: 1px solid var(--border-subtle);
        border-radius: 16px;
        background-color: #f4fbf8;
        color: var(--accent-hover);
        font-size: 15px;
        font-weight: 500;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        cursor: pointer;
        white-space: nowrap;
        transition: background-color 0.16s ease, transform 0.14s ease;
      }

      .secondary-btn:hover {
        background-color: #e5f6ef;
      }

      .secondary-btn:active {
        transform: scale(0.985);
      }

      .illustration-box {
        width: 100%;
        border-radius: 18px;
        background-color: var(--surface-mint);
        border: 1px solid var(--border-subtle);
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .illustration-box.aspect-4-3 {
        aspect-ratio: 4 / 3;
      }

      .illustration-box.aspect-1-1 {
        aspect-ratio: 1 / 1;
        max-width: 280px;
        margin: 0 auto;
      }

      .illustration-box svg {
        width: 100%;
        height: 100%;
        display: block;
      }

      /* Progress Bar */
      .progress-wrap {
        margin-bottom: 20px;
      }

      .progress-meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 10px;
        min-height: 40px;
      }

      .back-btn {
        background: none;
        border: none;
        min-height: 40px;
        padding: 4px 8px;
        margin-left: -8px;
        border-radius: 8px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 14px;
        font-weight: 500;
        color: var(--ink-secondary);
        cursor: pointer;
        white-space: nowrap;
        transition: color 0.15s ease;
      }

      .back-btn:hover {
        color: var(--ink-primary);
      }

      .back-btn:disabled {
        opacity: 0.5;
        cursor: default;
      }

      .progress-label-muted {
        font-size: 12px;
        font-weight: 500;
        color: var(--ink-muted);
      }

      .progress-count {
        margin: 0;
        font-size: 14px;
        font-weight: 600;
        color: var(--accent);
      }

      .progress-track {
        width: 100%;
        height: 10px;
        background-color: var(--progress-track);
        border-radius: 999px;
        overflow: hidden;
      }

      .progress-fill {
        height: 100%;
        background-color: var(--accent);
        border-radius: 999px;
        transition: width 0.28s cubic-bezier(0.16, 1, 0.3, 1);
      }

      /* Question Card */
      .question-meta {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        font-weight: 500;
        color: var(--accent);
      }

      .question-prompt {
        margin: 12px 0 0;
        font-size: 20px;
        font-weight: 700;
        line-height: 1.42;
        color: var(--ink-primary);
        text-wrap: balance;
      }

      .options-list {
        margin-top: 26px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .choice-btn {
        width: 100%;
        min-height: 76px;
        padding: 16px;
        border-radius: 16px;
        border: 1px solid var(--border-option);
        background-color: var(--surface-soft);
        color: var(--ink-primary);
        text-align: left;
        display: flex;
        align-items: flex-start;
        gap: 14px;
        cursor: pointer;
        transition:
          background-color 0.16s ease,
          border-color 0.16s ease,
          opacity 0.18s ease,
          transform 0.16s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .choice-btn:hover:not(:disabled) {
        background-color: var(--surface-hover);
        transform: translateY(-2px);
      }

      .choice-btn:active:not(:disabled) {
        transform: scale(0.985);
      }

      .choice-btn.is-selected {
        background-color: var(--surface-selected);
        border-color: var(--accent);
      }

      .choice-btn.is-bouncing {
        animation: choiceBounce 0.26s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }

      .choice-btn.is-dimmed {
        opacity: 0.55;
        transform: scale(0.99);
      }

      .choice-badge {
        width: 28px;
        height: 28px;
        border-radius: 10px;
        flex-shrink: 0;
        margin-top: 2px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        font-weight: 700;
        background-color: #e3f5ef;
        color: var(--accent);
        transition: background-color 0.16s ease, color 0.16s ease;
      }

      .choice-btn.is-selected .choice-badge {
        background-color: var(--accent);
        color: #ffffff;
      }

      .choice-text {
        font-size: 15px;
        font-weight: 500;
        line-height: 1.6;
        color: var(--ink-primary);
      }

      /* Result Screen */
      .result-nickname {
        margin: 8px 0 0;
        font-size: 17px;
        font-weight: 600;
        color: var(--accent-hover);
      }

      .result-desc {
        margin: 16px 0 0;
        font-size: 15px;
        line-height: 1.75;
        color: var(--ink-secondary);
      }

      .section-divider {
        margin: 32px 0;
        border: none;
        border-top: 1px solid var(--divider);
      }

      .rec-header {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
      }

      .rec-title {
        margin: 0;
        font-size: 18px;
        font-weight: 700;
        color: var(--ink-primary);
      }

      .rec-sub {
        font-size: 13px;
        color: var(--ink-muted);
      }

      .rec-list {
        list-style: none;
        margin: 20px 0 0;
        padding: 0;
      }

      .rec-item {
        padding: 16px 0;
        border-top: 1px solid var(--divider-light);
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .rec-item:first-child {
        border-top: none;
        padding-top: 8px;
      }

      .rec-item:last-child {
        padding-bottom: 4px;
      }

      .rec-num {
        font-size: 14px;
        font-weight: 700;
        color: var(--accent);
        width: 28px;
        flex-shrink: 0;
      }

      .rec-name-row {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 4px 10px;
      }

      .rec-name {
        font-size: 16px;
        font-weight: 600;
        color: var(--ink-primary);
      }

      .rec-cat {
        font-size: 13px;
        color: var(--ink-muted);
      }

      .rec-summary {
        margin: 4px 0 0;
        font-size: 14px;
        line-height: 1.6;
        color: var(--ink-secondary);
      }

      .result-actions {
        margin-top: 32px;
        padding-top: 24px;
        border-top: 1px solid var(--divider);
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      /* Animations */
      .fade-enter {
        animation: screenEnter 0.24s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .question-enter {
        animation: questionEnter 0.22s cubic-bezier(0.16, 1, 0.3, 1);
      }

      @keyframes choiceBounce {
        0% {
          transform: scale(1);
        }
        42% {
          transform: scale(1.035);
        }
        76% {
          transform: scale(0.99);
        }
        100% {
          transform: scale(1.01);
        }
      }

      @keyframes screenEnter {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes questionEnter {
        from {
          opacity: 0;
          transform: translateX(16px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .fade-enter,
        .question-enter,
        .choice-btn.is-bouncing {
          animation: none !important;
        }
        .progress-fill,
        .choice-btn,
        .primary-btn {
          transition: none !important;
        }
      }

      @media (min-width: 640px) {
        .app-header {
          padding: 20px 32px 8px;
        }
        .brand-btn {
          font-size: 16px;
        }
        .home-btn {
          font-size: 14px;
        }
        .app-main {
          padding: 36px 32px;
        }
        .card {
          padding: 36px 40px;
        }
        .hero-title {
          font-size: 36px;
        }
        .hero-desc {
          font-size: 16px;
        }
        .primary-btn,
        .secondary-btn {
          width: auto;
        }
        .question-prompt {
          font-size: 24px;
        }
        .choice-btn {
          padding: 20px;
        }
        .choice-text {
          font-size: 16px;
        }
        .rec-item {
          flex-direction: row;
          align-items: baseline;
          gap: 20px;
        }
        .result-actions {
          flex-direction: row;
          align-items: center;
        }
      }

      @media (min-width: 768px) {
        .start-grid {
          grid-template-columns: 7fr 5fr;
          gap: 36px;
        }
        .result-grid {
          grid-template-columns: 5fr 7fr;
          gap: 36px;
        }
        .illustration-box.aspect-1-1 {
          max-width: none;
        }
      }
    </style>
  </head>
  <body>
    <header class="app-header">
      <div class="header-inner">
        <button type="button" id="brandHomeBtn" class="brand-btn">
          나에게 맞는 직무 유형 테스트
        </button>
        <button type="button" id="headerHomeBtn" class="home-btn" hidden>
          처음으로
        </button>
      </div>
    </header>

    <main id="appMain" class="app-main"></main>

    <script>
      const QUIZ_QUESTIONS = [
        {
          id: 1,
          situation: '조별과제',
          prompt: '첫 팀플 모임, 다들 어색하게 눈치만 보고 있다면 나는?',
          options: [
            {
              id: 'A',
              text: '“우리 목표랑 마감일부터 먼저 정할까요?” 역할을 나누고 일정을 짠다.',
              role: 'pm',
            },
            {
              id: 'B',
              text: '“자료 모아서 바로 쓸 수 있게 공유 폴더랑 문서 틀부터 만들어둘게요.”',
              role: 'dev',
            },
          ],
        },
        {
          id: 2,
          situation: '동아리',
          prompt: '동아리 신입 부원 모집 포스터를 만들 때 가장 먼저 신경 쓰는 것은?',
          options: [
            {
              id: 'A',
              text: '지나가다 시선이 멈추도록 색감, 폰트 크기, 여백의 균형을 맞춘다.',
              role: 'design',
            },
            {
              id: 'B',
              text: '작년 지원자가 가장 많이 들어온 채널과 반응 좋았던 문구를 찾아본다.',
              role: 'data',
            },
          ],
        },
        {
          id: 3,
          situation: '아르바이트',
          prompt: '카페 알바 중 점심 피크타임마다 주문이 밀려 정신이 없다. 이때 내 반응은?',
          options: [
            {
              id: 'A',
              text: '“포스기·음료 제조·픽업 안내로 동선을 나누자”며 팀 호흡을 맞춘다.',
              role: 'pm',
            },
            {
              id: 'B',
              text: '“12시 반부터 아메리카노가 몰리니까 미리 샷을 내려두자”며 패턴을 활용한다.',
              role: 'data',
            },
          ],
        },
        {
          id: 4,
          situation: '조별과제',
          prompt: '발표 하루 전, 팀원들이 각자 만든 PPT 슬라이드를 하나로 합쳤더니 중구난방이다.',
          options: [
            {
              id: 'A',
              text: '목차 번호와 하이퍼링크, 페이지 흐름이 어긋난 곳 없이 작동하는지 점검한다.',
              role: 'dev',
            },
            {
              id: 'B',
              text: '전체 컬러 톤과 도형 정렬, 표 여백을 통일해서 보기 편하게 다듬는다.',
              role: 'design',
            },
          ],
        },
        {
          id: 5,
          situation: '학교생활',
          prompt: '학과 축제 부스를 운영하게 됐다! 내가 가장 맡고 싶은 역할은?',
          options: [
            {
              id: 'A',
              text: '부스 콘셉트부터 예산 분배, 근무 시간표까지 전체 운영을 총괄한다.',
              role: 'pm',
            },
            {
              id: 'B',
              text: '누가 봐도 들르고 싶어지도록 간판 배너와 굿즈, 메뉴판을 감각적으로 만든다.',
              role: 'design',
            },
          ],
        },
        {
          id: 6,
          situation: '아르바이트',
          prompt: '편의점 알바 중 창고 재고를 정리해야 할 때 나에게 더 편한 방식은?',
          options: [
            {
              id: 'A',
              text: '품목과 유통기한 규칙을 정해 누구든 바로 찾을 수 있게 구역을 체계화한다.',
              role: 'dev',
            },
            {
              id: 'B',
              text: '최근 일주일 판매량을 확인해 잘 나가는 품목 위주로 발주 수량을 계산한다.',
              role: 'data',
            },
          ],
        },
        {
          id: 7,
          situation: '동아리',
          prompt: '동아리 홍보용 소개 페이지가 필요하다는 의견이 나왔다. 내가 먼저 하는 생각은?',
          options: [
            {
              id: 'A',
              text: '“신입생이 가장 궁금해할 Q&A랑 활동 일정이 맨 위에 보여야 해.”',
              role: 'pm',
            },
            {
              id: 'B',
              text: '“모바일에서도 끊김 없이 열리도록 웹페이지나 폼 연동 구조부터 짜보자.”',
              role: 'dev',
            },
          ],
        },
        {
          id: 8,
          situation: '조별과제',
          prompt: '중간 발표 자료에 설문조사 결과를 넣어야 한다. 어떤 식으로 보여줄까?',
          options: [
            {
              id: 'A',
              text: '핵심 메시지가 바로 읽히도록 직관적인 아이콘과 카드 레이아웃으로 구성한다.',
              role: 'design',
            },

      function calculateRoleResult(answers) {
        const scores = {pm: 0, dev: 0, design: 0, data: 0};

        for (const q of QUIZ_QUESTIONS) {
          const choiceId = answers[q.id];
          const selected = q.options.find((opt) => opt.id === choiceId);
          if (selected) {
            scores[selected.role] += 1;
          }
        }

        const maxScore = Math.max(...Object.values(scores));
        const tiedRoles = Object.keys(scores).filter((role) => scores[role] === maxScore);

        if (tiedRoles.length === 1) {
          return ROLE_RESULTS[tiedRoles[0]];
        }

        const headToHead = {pm: 0, dev: 0, design: 0, data: 0};
        for (const q of QUIZ_QUESTIONS) {
          const [optA, optB] = q.options;
          if (tiedRoles.includes(optA.role) && tiedRoles.includes(optB.role)) {
            const choiceId = answers[q.id];
            const selected = q.options.find((opt) => opt.id === choiceId);
            if (selected) {
              headToHead[selected.role] += 1;
            }
          }
        }

        tiedRoles.sort((a, b) => headToHead[b] - headToHead[a]);
        return ROLE_RESULTS[tiedRoles[0]];
      }

        clearPendingTimer();
        state.step = 'start';

        if (state.isTransitioning || state.currentIndex <= 0) return;
        state.currentIndex -= 1;
        render();

      function handleSelectOption(choiceId) {
        if (state.step !== 'quiz' || state.isTransitioning) return;

        state.isTransitioning = true;
        const question = QUIZ_QUESTIONS[state.currentIndex];
        const buttons = appMain.querySelectorAll('.choice-btn');

        buttons.forEach((btn) => {
          btn.disabled = true;
          const optId = btn.getAttribute('data-choice');
          if (optId === choiceId) {
            btn.classList.add('is-selected', 'is-bouncing');
            btn.setAttribute('aria-checked', 'true');
            const badge = btn.querySelector('.choice-badge');
            if (badge) {
              badge.innerHTML =
                '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>';
            }
          } else {
            btn.classList.remove('is-selected');
            btn.classList.add('is-dimmed');
            btn.setAttribute('aria-checked', 'false');
          }
        });

        clearPendingTimer();
        state.timerId = window.setTimeout(() => {
          state.timerId = null;
          state.answers[question.id] = choiceId;
          state.isTransitioning = false;

          if (state.currentIndex + 1 < QUIZ_QUESTIONS.length) {
            state.currentIndex += 1;
          } else {
            state.step = 'result';
          }
          render();
        }, 280);
      }

      async function handleCopySummary(result) {
        const summaryText = [
          '[나에게 맞는 직무 유형 테스트 결과]',
          `유형: ${result.title} (${result.subtitle})`,
          `한 줄 별명: ${result.nickname}`,
          `추천 준비: ${result.recommendations.map((item) => item.name).join(', ')}`,
        ].join('\n');

        let success = false;
        if (navigator.clipboard && navigator.clipboard.writeText) {
          try {
            await navigator.clipboard.writeText(summaryText);
            success = true;
          } catch (_) {
            success = false;
          }
        }

        if (!success) {
          const textarea = document.createElement('textarea');
          textarea.value = summaryText;
          textarea.style.position = 'fixed';
          textarea.style.opacity = '0';
          document.body.appendChild(textarea);
          textarea.select();
          try {
            success = document.execCommand('copy');
          } catch (_) {
            success = false;
          }
          document.body.removeChild(textarea);
        }

        if (success) {
          state.copied = true;
          const copyBtn = document.getElementById('copyResultBtn');
          if (copyBtn) {
            copyBtn.innerHTML =
              '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg><span>결과를 복사했어요</span>';
          }
          window.setTimeout(() => {
            if (state.step === 'result') {
              state.copied = false;
              const btn = document.getElementById('copyResultBtn');
              if (btn) {
                btn.innerHTML =
                  '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg><span>결과 요약 복사</span>';
              }
            }
          }, 2000);
        }
      }

      function renderStart() {
        appMain.innerHTML = `
          <section class="container-wide fade-enter">
            <div class="card">
              <div class="start-grid">
                <div>
                  <p class="kicker">대학생 2~4학년 진로 탐색 · 12문항 · 약 2분</p>
                  <h1 class="hero-title">나에게 맞는 직무 유형 테스트</h1>
                  <p class="hero-desc">
                    아직 직무가 막막해도 괜찮아요. 조별과제, 동아리, 아르바이트에서 내가 편하게
                    느끼는 행동을 고르다 보면 어울리는 직무와 지금 준비할 것들을 바로 확인할 수 있어요.
                  </p>
                  <div class="role-line">
                    <span>기획형 PM</span>
                    <span aria-hidden="true">·</span>
                    <span>논리형 개발자</span>
                    <span aria-hidden="true">·</span>
                    <span>감각형 디자이너</span>
                    <span aria-hidden="true">·</span>
                    <span>분석형 데이터</span>
                  </div>
                  <div class="cta-wrap">
                    <button type="button" id="startBtn" class="primary-btn">
                      <span>시작하기</span>
                      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                      </svg>
                    </button>
                  </div>
                </div>
                <div>
                  <div class="illustration-box aspect-4-3">
                    ${ILLUSTRATIONS.hero}
                  </div>
                </div>
              </div>
            </div>
          </section>
        `;

        document.getElementById('startBtn').addEventListener('click', startQuiz);
      }

      function renderQuiz() {
        const question = QUIZ_QUESTIONS[state.currentIndex];
        const total = QUIZ_QUESTIONS.length;
        const progressPercent = ((state.currentIndex + 1) / total) * 100;
        const savedChoice = state.answers[question.id];

        const leftControlHtml =
          state.currentIndex > 0
            ? `<button type="button" id="backBtn" class="back-btn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <line x1="19" y1="12" x2="5" y2="12"></line>
                  <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                <span>이전</span>
              </button>`
            : '<span class="progress-label-muted">일하는 스타일 진단</span>';

        const optionsHtml = question.options
          .map((opt) => {
            const isSelected = savedChoice === opt.id;
            const badgeInner = isSelected
              ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>'
              : opt.id;

            return `
              <button
                type="button"
                role="radio"
                aria-checked="${isSelected}"
                data-choice="${opt.id}"
                class="choice-btn ${isSelected ? 'is-selected' : ''}"
              >
                <span class="choice-badge">${badgeInner}</span>
                <span class="choice-text">${opt.text}</span>
              </button>
            `;
          })
          .join('');

        appMain.innerHTML = `
          <section class="container-quiz">
            <div class="progress-wrap">
              <div class="progress-meta">
                <div>${leftControlHtml}</div>
                <p class="progress-count tabular-nums">${state.currentIndex + 1}/${total}</p>
              </div>
              <div
                class="progress-track"
                role="progressbar"
                aria-valuenow="${state.currentIndex + 1}"
                aria-valuemin="1"
                aria-valuemax="${total}"
                aria-label="진행률 ${state.currentIndex + 1} / ${total}"
              >
                <div class="progress-fill" style="width: ${progressPercent}%"></div>
              </div>
            </div>

            <div class="card question-enter">
              <div class="question-meta">
                <span>${question.situation}</span>
                <span aria-hidden="true">·</span>
                <span class="tabular-nums">질문 ${String(state.currentIndex + 1).padStart(2, '0')}</span>
              </div>
              <h2 class="question-prompt">${question.prompt}</h2>
              <div class="options-list" role="radiogroup" aria-label="${question.prompt}">
                ${optionsHtml}
              </div>
            </div>
          </section>
        `;

        const backBtn = document.getElementById('backBtn');
        if (backBtn) {
          backBtn.addEventListener('click', handleBack);
        }

        appMain.querySelectorAll('.choice-btn').forEach((btn) => {
          btn.addEventListener('click', () => {
            handleSelectOption(btn.getAttribute('data-choice'));
          });
        });
      }

      function renderResult() {
        const result = calculateRoleResult(state.answers);

        const recHtml = result.recommendations
          .map(
            (item, idx) => `
              <li class="rec-item">
                <span class="rec-num tabular-nums">${String(idx + 1).padStart(2, '0')}.</span>
                <div>
                  <div class="rec-name-row">
                    <span class="rec-name">${item.name}</span>
                    <span class="rec-cat">· ${item.category}</span>
                  </div>
                  <p class="rec-summary">${item.summary}</p>
                </div>
              </li>
            `
          )
          .join('');

        appMain.innerHTML = `
          <section class="container-wide fade-enter">
            <div class="card">
              <div class="result-grid">
                <div>
                  <div class="illustration-box aspect-1-1">
                    ${ILLUSTRATIONS[result.type]}
                  </div>
                </div>
                <div>
                  <p class="kicker">나의 직무 유형 · ${result.subtitle}</p>
                  <h1 class="hero-title">${result.title}</h1>
                  <p class="result-nickname">“${result.nickname}”</p>
                  <p class="result-desc">${result.description}</p>
                </div>
              </div>

              <hr class="section-divider" />

              <div>
                <div class="rec-header">
                  <h2 class="rec-title">지금부터 준비해보면 좋은 자격증 · 과목 3가지</h2>
                  <span class="rec-sub">부담 없이 1개부터 시작해 보세요</span>
                </div>
                <ol class="rec-list">
                  ${recHtml}
                </ol>
              </div>

              <div class="result-actions">
                <button type="button" id="restartBtn" class="primary-btn">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <polyline points="1 4 1 10 7 10"></polyline>
                    <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
                  </svg>
                  <span>다시하기</span>
                </button>
                <button type="button" id="copyResultBtn" class="secondary-btn">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                  </svg>
                  <span>결과 요약 복사</span>
                </button>
              </div>
            </div>
          </section>
        `;

        document.getElementById('restartBtn').addEventListener('click', resetToStart);
        document
          .getElementById('copyResultBtn')
          .addEventListener('click', () => handleCopySummary(result));
      }

      function render() {
        headerHomeBtn.hidden = state.step === 'start';

        if (state.step === 'start') {
          renderStart();
        } else if (state.step === 'quiz') {
          renderQuiz();
        } else {
          renderResult();
        }
      }

      brandHomeBtn.addEventListener('click', resetToStart);
      headerHomeBtn.addEventListener('click', resetToStart);

      window.addEventListener('keydown', (event) => {
        if (state.step !== 'quiz' || state.isTransitioning) return;
        if (event.key === '1') {
          handleSelectOption('A');
        } else if (event.key === '2') {
          handleSelectOption('B');
        }
      });

      render();
    </script>
  </body>
</html>
